# 週1回：公式サイトから仕様・価格を集め、点検し、データ更新の PR を作ります。
# - 毎週火曜 6:23（日本時間）。手動実行もできます（Actions → weekly-data → Run workflow）。
# - PR を作るには、リポジトリの Settings → Actions → General →
#   「Allow GitHub Actions to create and approve pull requests」を有効にしてください。
# - 自動マージは、リポジトリ変数 AUTO_MERGE_DATA が "true" のときだけ（初期は無効）。
#   有効にすると、確認（check・build）が通ったデータ更新は本番へ反映されます。
name: weekly-data
on:
  schedule:
    - cron: "23 21 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: weekly-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright (Chromium)
        run: npx --yes playwright@1.56.1 install --with-deps chromium && npm i --no-save playwright@1.56.1
      - name: Collect official specs and prices
        run: npm run shoes:collect
        continue-on-error: true
      - run: npm run shoes:audit -- --write
      - run: npm run seo:audit -- --write
        continue-on-error: true
      - run: npm run ameblo:drafts
      - run: npm run weekly:report
      - run: npm run check
      - run: npx next build
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE_DATA }}
        run: |
          if git diff --quiet; then echo "変更なし"; exit 0; fi
          BR="data/weekly-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add data docs drafts
          git commit -m "週次データ更新（公式の仕様・価格、点検レポート、アメブロ下書き）"
          git push -u origin "$BR"
          gh pr create --title "週次データ更新 $(date -u +%Y-%m-%d)" --body "自動生成。data/shoes/last-run.json と docs/agent/QUEUE.md、docs/seo/report.md を確認してください。"
          if [ "$AUTO_MERGE" = "true" ]; then gh pr merge --squash --delete-branch; fi
